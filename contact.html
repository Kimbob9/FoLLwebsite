<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact | Friends of Longridge Library</title>
  <meta name="description" content="Get in touch with the Friends of Longridge Library.">
  <link rel="icon" type="image/jpeg" href="images/logo.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bitter:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <!-- content.js holds your news, events and photos. It must load BEFORE main.js. -->
  <script src="js/content.js" defer></script>
  <script src="js/main.js" defer></script>
</head>
<body data-page="contact">
  <a class="skip-link" href="#main">Skip to main content</a>

  <!-- The menu is built automatically by js/main.js. The links below only show if JavaScript is switched off. -->
  <header class="site-header" id="site-header">
    <noscript>
      <nav class="container" aria-label="Main">
        <a href="index.html">Home</a> | <a href="about.html">About us</a> | <a href="events.html">Events</a> | <a href="gallery.html">Photo gallery</a> | <a href="contact.html">Contact</a>
      </nav>
    </noscript>
  </header>

  <main id="main">
    <div class="page-head">
      <div class="container">
        <h1>Contact us</h1>
        <p>Questions, ideas, book donations or offers of help: we would love to hear from you.</p>
      </div>
    </div>

    <section class="section">
      <div class="container two-col">
        <div>
          <h2>Send us a message</h2>
          <!-- The form's behaviour is set in js/content.js (contactFormEndpoint).
               You can change the topics in the drop-down below: edit or copy an <option> line. -->
          <form id="contact-form" action="#" method="post">
            <div class="form-field">
              <label for="name">Your name</label>
              <input id="name" name="name" type="text" autocomplete="name" required>
            </div>
            <div class="form-field">
              <label for="email">Your email address</label>
              <input id="email" name="email" type="email" autocomplete="email" required>
            </div>
            <div class="form-field">
              <label for="topic">What is your message about?</label>
              <select id="topic" name="topic" required>
                <option value="General question">General question</option>
                <option value="Volunteering">Volunteering</option>
                <option value="Events">Events</option>
                <option value="Book donations">Book donations</option>
                <option value="Something else">Something else</option>
              </select>
            </div>
            <div class="form-field">
              <label for="message">Your message</label>
              <textarea id="message" name="message" required></textarea>
            </div>
            <!-- Spam trap: hidden from people, but bots fill it in. Please leave as it is. -->
            <div class="hp" aria-hidden="true">
              <label for="website">Leave this field empty</label>
              <input id="website" name="website" type="text" tabindex="-1" autocomplete="off">
            </div>
            <button class="btn btn-solid" type="submit">Send message</button>
            <p class="form-status" id="form-status" role="status" aria-live="polite"></p>
          </form>
        </div>

        <aside class="contact-card" aria-label="Other ways to reach us">
          <h2>Find us</h2>
          <!-- Address and email come from js/content.js (section 1). -->
          <address id="contact-address"></address>
          <p>Email: <a id="contact-email" href="#"></a></p>
          <h2>Follow us</h2>
          <!-- Social links come from js/content.js (section 2). -->
          <ul class="social-list" id="social-links"></ul>
        </aside>
      </div>
    </section>
  </main>

  <!-- The footer is built automatically from js/content.js (email, social links, small print). -->
  <footer class="site-footer" id="site-footer"></footer>
</body>
</html>
